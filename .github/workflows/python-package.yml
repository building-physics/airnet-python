name: Python package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CPython ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            hatch-python: "311"
          - python-version: "3.12"
            hatch-python: "312"
          - python-version: "3.13"
            hatch-python: "313"
          - python-version: "3.14"
            hatch-python: "314"
          - python-version: "3.15"
            hatch-python: "315"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch
      - name: Run unit and regression tests
        run: hatch run +py=${{ matrix.hatch-python }} test:test

  minimum-dependencies:
    name: Minimum dependencies / Python 3.11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch
      - name: Run tests with minimum dependencies
        run: hatch run minimum:test

  windows:
    name: CPython 3.12 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch
      - name: Run unit and regression tests
        run: hatch run +py=312 test:test

  coverage:
    name: Coverage / Python 3.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch
      - name: Run coverage
        run: hatch run +py=312 test:cov

  quality:
    name: Lint and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch
      - name: Lint
        run: hatch run lint:check
      - name: Build HTML and PDF documentation
        run: hatch run docs:build
      - name: Upload PDF documentation
        uses: actions/upload-artifact@v7
        with:
          name: airnet-documentation-pdf
          path: docs/_build/pdf/airnet.pdf
          if-no-files-found: error

  package:
    name: Build and inspect package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade pip hatch twine
      - name: Build distributions
        run: hatch build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke test the wheel
        run: |
          python -m venv package-check
          package-check/bin/python -m pip install dist/*.whl
          package-check/bin/python -c "import airnet; from airnet.__about__ import __version__; print(__version__)"
          package-check/bin/airnet --version
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
