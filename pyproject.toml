[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airnet"
description = 'Solve AIRNET pressure networks.'
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = []
authors = [
  { name = "Jason W. DeGraw", email = "jason.degraw@gmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click>=8.0",
  "numpy>=1.23.5",
  "scipy>=1.12",
]
dynamic = ["version"]

[project.scripts]
airnet = "airnet.cli:main"

[project.urls]
Documentation = "https://github.com/building-physics/airnet-python#readme"
Issues = "https://github.com/building-physics/airnet-python/issues"
Source = "https://github.com/building-physics/airnet-python"

[tool.hatch.version]
path = "src/airnet/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "pytest",
  "pytest-cov",
]

[tool.hatch.envs.test]
dependencies = [
  "pytest",
  "pytest-cov",
]
[tool.hatch.envs.test.scripts]
test = "pytest tests regression-tests {args}"
cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=src/airnet --cov=tests tests regression-tests {args}"

[[tool.hatch.envs.test.matrix]]
python = ["311", "312", "313", "314", "315"]

[tool.hatch.envs.minimum]
python = "3.11"
dependencies = [
  "click==8.0.0",
  "numpy==1.23.5",
  "pytest",
  "scipy==1.12.0",
]
[tool.hatch.envs.minimum.scripts]
test = "pytest tests regression-tests {args}"

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "ruff",
]
[tool.hatch.envs.lint.scripts]
check = "ruff check . {args}"

[tool.hatch.envs.docs]
dependencies = [
  "pydata-sphinx-theme",
  "rst2pdf",
  "sphinx",
]
[tool.hatch.envs.docs.scripts]
html = "sphinx-build -W --keep-going -b html docs docs/_build/html {args}"
pdf = "sphinx-build -W --keep-going -b pdf docs docs/_build/pdf {args}"
build = [
  "sphinx-build -W --keep-going -b html docs docs/_build/html {args}",
  "sphinx-build -W --keep-going -b pdf docs docs/_build/pdf {args}",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "src/airnet/__about__.py",
  "tests/*"
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
